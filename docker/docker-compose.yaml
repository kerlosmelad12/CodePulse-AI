services:
    neo4j:
      image: neo4j:5-community
      container_name: neo4j
      restart: always
      ports:
        - "127.0.0.1:7474:7474"   # Neo4j Browser UI (Local only)
        - "127.0.0.1:7687:7687"   # Bolt Protocol (Local only)
      environment:
        NEO4J_AUTH: "${NEO4J_AUTH:-neo4j/password123}"
        NEO4J_PLUGINS: "${NEO4J_PLUGINS:-[\"apoc\"]}"
      volumes:
        - neo4j_data:/data
        - neo4j_logs:/logs
        - neo4j_config:/conf
      healthcheck:
        test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 20
        start_period: 40s


volumes:
  neo4j_config:
  neo4j_logs:
  neo4j_data:
